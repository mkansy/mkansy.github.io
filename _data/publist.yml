- title: "No Training, No Problem: Rethinking Classifier-Free Guidance for Diffusion Models"
  image: icg.png
  conference: International Conference on Learning Representations (ICLR), 2025
  description: We show that applying classifier-free guidance (CFG) does not require any specific training procedure (e.g., inserting a null condition during training), and CFG can be extended to a more general method that is applicable to any diffusion model, including unconditional ones.
  authors: Seyedmorteza Sadat (DisneyResearch|Studios / ETH Zurich), Manuel Kansy (DisneyResearch|Studios / ETH Zurich), Otmar Hilliges (ETH Zurich), Romann M. Weber (DisneyResearch|Studios)
  link:
    url: https://studios.disneyresearch.com/app/uploads/2025/05/No-Training-No-Problem-Rethinking-Classifier-Free-Guidance-for-Diffusion-Models-Paper.pdf
    display: Paper
  highlight: 1

- title: Controllable Inversion of Black-Box Face Recognition Models via Diffusion
  image: id3pm.gif
  conference: IEEE/CVF International Conference on Computer Vision (ICCV) Workshops, 2023
  description: We tackle the challenging task of inverting the latent space of pre-trained face recognition models without full model access (i.e. black-box setting). Our method, the identity denoising diffusion probabilistic model (ID3PM), leverages the stochastic nature of the denoising diffusion process to produce high-quality, identity-preserving face images with various backgrounds, lighting, poses, and expressions.
  authors: Manuel Kansy (DisneyResearch|Studios / ETH Zurich), Anton Raël (ETH Zurich), Graziana Mignone (DisneyResearch|Studios), Jacek Naruniec (DisneyResearch|Studios), Christopher Schroers (DisneyResearch|Studios), Markus Gross (DisneyResearch|Studios / ETH Zurich), Romann M. Weber (DisneyResearch|Studios)
